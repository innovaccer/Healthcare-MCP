[pytest]
testpaths = tests
python_files = test_*.py
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = src 
addopts = --cov=src --cov-report=term --cov-report=xml
norecursedirs = .* *.egg *.egg-info build dist node_modules venv tasks
filterwarnings = error::mcp.MCPDeprecationWarning
