name: Feature request
description: Suggest an idea or enhancement for HMCP
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please describe the problem you are trying to solve,
        and use **synthetic data only** in any examples.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what is missing or painful today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you would like HMCP to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches you have considered.
    validations:
      required: false
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: This request contains no PHI, real patient data, credentials or tokens.
          required: true
